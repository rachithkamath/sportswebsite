<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MVJCE Championship | Inter-Department 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F2;--surf:#fff;--ink:#22161A;--mute:#6E5C60;--line:#EBDAD2;--pitch:#B8322A;--sig:#F5921E;--live:#E5391F;--dark:#241519;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170F11;--surf:#241719;--ink:#F6EBE6;--mute:#B39FA2;--line:#3A2A2D;--pitch:#D8402F;--dark:#0E0809;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#170F11;--surf:#241719;--ink:#F6EBE6;--mute:#B39FA2;--line:#3A2A2D;--pitch:#D8402F;--dark:#0E0809;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'DM Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-.02em;line-height:1.05;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:20px;height:60px}
.logo{font:800 20px 'Bricolage Grotesque',sans-serif;display:flex;align-items:center;gap:8px;flex:none}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 3px var(--pitch)}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav a{padding:7px 12px;border-radius:99px;font-weight:500;color:var(--mute);white-space:nowrap;transition:background .2s,color .2s}
nav a:hover{color:var(--ink)}nav a.on{background:var(--pitch);color:#fff}
a:focus-visible,button:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
main{min-height:70vh;padding:40px 0 64px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{display:grid;gap:32px;grid-template-columns:1.1fr .9fr;align-items:center;padding:24px 0 48px}
.hero h1{font-size:clamp(44px,8vw,84px);font-weight:800}
.hero p{color:var(--mute);font-size:18px;max-width:30em;margin:18px 0 26px}
.btn{display:inline-block;padding:12px 20px;border-radius:99px;font-weight:600;background:var(--pitch);color:#fff;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.alt{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.board{background:var(--pitch);color:#fff;border-radius:24px;padding:26px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed rgba(244,246,241,.14)}
.board>*{position:relative;z-index:1}
.score{display:flex;justify-content:space-between;align-items:center;margin:22px 0}
.score div{text-align:center;width:42%}
.score b{display:block;font:800 clamp(56px,9vw,88px)/1 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.score span{font-weight:600;opacity:.85}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:translateY(-10px);color:var(--sig)}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--mute)}
.pill.live{background:var(--live);color:#fff}.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.pill.upcoming{background:var(--sig);color:#2a2000}
@keyframes pulse{50%{opacity:.25}}
.sub{color:var(--mute);font-size:14px}
.sec{margin-top:56px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px}
.sech h2{font-size:clamp(28px,4vw,38px);font-weight:800}
.sech a{color:var(--mute);font-weight:500}.sech a:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
a.row:hover{padding-left:14px;background:var(--surf)}
.row .grow{flex:1;min-width:0}
.row h3{font-size:21px;font-weight:500}
.rank{font:800 22px 'Bricolage Grotesque',sans-serif;width:34px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--pitch);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.top1 .bar i{background:var(--sig)}
.pts{font:800 24px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.chip{border:0;font:500 14px 'DM Sans',sans-serif;padding:7px 14px;border-radius:99px;background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;transition:all .2s}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.vs{display:flex;align-items:center;gap:10px;font:800 20px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.vs em{font-style:normal;color:var(--mute);font-weight:500;font-size:14px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin:28px 0;padding:20px 0;border-block:1px solid var(--line)}
.info b{display:block;font-weight:600}.info span{color:var(--mute);font-size:14px}
.pageh h1{font-size:clamp(40px,7vw,68px);font-weight:800;margin:6px 0 10px}
.back{color:var(--mute);font-weight:500}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sets div{padding:12px 18px;border-radius:14px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.empty{padding:40px 0;color:var(--mute)}
.day{font:800 18px 'Bricolage Grotesque',sans-serif;margin:30px 0 4px}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--mute);font-size:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.row h3{font-size:18px}header .wrap{gap:10px}.logo span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.logo img{height:42px;width:auto;border-radius:8px;background:#fff;padding:2px}.logo span{font-size:15px;color:var(--mute);font-weight:500}
header{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
nav a.on{background:linear-gradient(90deg,var(--pitch),var(--sig));color:#fff}
.btn{background:linear-gradient(90deg,var(--pitch),var(--sig));color:#fff;box-shadow:0 6px 18px -6px var(--pitch)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:44px 36px;color:#fff;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.08) 46px 49px),linear-gradient(115deg,#8E1F1F 0%,var(--pitch) 50%,var(--sig) 125%)}
.hero p{color:rgba(255,255,255,.88)}.hero .btn{background:#fff;color:#8E1F1F;box-shadow:none}.hero .btn.alt{background:none;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.ball{position:absolute;left:46%;bottom:-6px;font-size:56px;animation:bounce 1.6s cubic-bezier(.3,0,.7,1) infinite;z-index:2;pointer-events:none}
@keyframes bounce{0%,100%{transform:translateY(-150px) rotate(0)}50%{transform:translateY(0) rotate(180deg)}}
.pick{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.pick button{width:46px;height:46px;border-radius:50%;border:0;font-size:22px;cursor:pointer;background:rgba(255,255,255,.18);transition:transform .2s,background .2s}
.pick button:hover{transform:translateY(-4px) scale(1.08)}.pick button.on{background:#fff;transform:scale(1.12)}
.pinfo{margin-top:14px;min-height:48px;font-weight:500}.pinfo a{text-decoration:underline}
.board{background:var(--dark);transition:transform .15s;box-shadow:0 24px 50px -20px rgba(0,0,0,.5)}
.board::after{border-color:rgba(255,255,255,.12)}
.count{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:16px 22px;border-radius:18px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line)}
.count b{font:800 26px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums;color:var(--pitch)}
.ico{flex:none;font-size:26px;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);transition:transform .3s}
a.row:hover .ico{transform:rotate(-12deg) scale(1.15)}
.rank{font-size:24px}.top1 .bar i{background:linear-gradient(90deg,var(--pitch),var(--sig))}
.poll{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.poll button{border:0;cursor:pointer;font:700 18px 'Bricolage Grotesque',sans-serif;padding:12px 26px;border-radius:99px;background:var(--surf);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .15s}
.poll button:hover{transform:scale(1.06)}.poll button.on{background:var(--pitch);color:#fff;box-shadow:none}
.pbar{flex-basis:100%;height:10px;border-radius:99px;background:var(--sig);overflow:hidden}.pbar i{display:block;height:100%;width:50%;background:var(--pitch);transition:width .6s}
.pill.upcoming{color:#2a1700}
@media(max-width:760px){.hero{padding:28px 20px}.ball{display:none}}
.hero h1 .w{display:inline-block;animation:wd .8s cubic-bezier(.2,.8,.2,1) both}.hero h1 .w:nth-child(1){animation-delay:.05s}.hero h1 .w:nth-child(2){animation-delay:.18s}.hero h1 .w:nth-child(3){animation-delay:.31s}.hero h1 .w:nth-child(4){animation-delay:.44s}
@keyframes wd{from{opacity:0;transform:translateY(44px) rotate(5deg)}}
.mq{overflow:hidden;margin-top:18px;border-block:1px solid var(--line);padding:10px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq>div{display:flex;width:max-content;animation:mq 30s linear infinite}.mq:hover>div{animation-play-state:paused}.mq span{margin-right:40px;font-weight:600;color:var(--mute);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.row{animation:rowin .45s cubic-bezier(.2,.8,.2,1) both}@keyframes rowin{from{opacity:0;transform:translateX(-14px)}}
.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-120%)}.btn:hover::after{transform:translateX(120%);transition:transform .6s}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:99;pointer-events:none;animation:cf 1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),calc(var(--y) + 120px)) rotate(var(--r));opacity:0}}
.track{position:relative;padding:14px 18px 14px 12px;border-radius:22px;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.07) 79px 80px),linear-gradient(180deg,#A82B24,#C8432F);box-shadow:0 20px 40px -22px var(--pitch)}
.lane{display:flex;align-items:center;height:32px;border-bottom:1.5px dashed rgba(255,255,255,.4);transition:background .3s}.lane:last-of-type{border-bottom:0}
.ln{width:74px;flex:none;color:#fff;font:700 12px 'DM Sans',sans-serif;padding-left:6px}
.lt{position:relative;flex:1;height:100%;margin-right:26px}
.run{position:absolute;top:50%;left:0;width:46px;height:22px;margin-top:-11px;border-radius:99px;background:#fff;color:#8E1F1F;font:800 10px/22px 'DM Sans',sans-serif;text-align:center;transition:left 2.4s cubic-bezier(.2,.8,.25,1),transform .2s;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.go .run{left:calc((100% - 46px)*var(--p)/100)}
.lane:hover .run{transform:scale(1.15)}.lane:hover{background:rgba(255,255,255,.1)}
.lane.first .run{background:var(--sig);color:#3a2000}
.lane.me{background:rgba(255,255,255,.22)}.lane.me .run{background:#22161A;color:#fff;box-shadow:0 0 0 3px var(--sig)}
.fin{position:absolute;right:12px;top:10px;bottom:10px;width:14px;border-radius:3px;background:repeating-conic-gradient(#fff 0 25%,#22161A 0 50%) 0 0/14px 14px}
.mine{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 14px}.mine label{font-weight:600}
.mine select{font:500 15px 'DM Sans',sans-serif;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink)}
.rp{border:0;cursor:pointer;font:600 14px 'DM Sans',sans-serif;padding:7px 14px;border-radius:99px;background:var(--ink);color:var(--bg)}
@media(max-width:760px){.ln{width:58px;font-size:11px}}
</style>
</head>

home(){const m=M[0],s=sp(m.s);return`<section class="hero"><span class="ball">🏐</span><div><h1><span class="w">One</span> <span class="w">campus.</span> <span class="w">One</span> <span class="w">champion.</span></h1><p>Sixteen MVJ departments. Twenty sports. Follow every serve, shot and point as it happens.</p><div class="btns"><a class="btn" href="#sports">Explore sports</a><a class="btn alt" href="#schedule">View schedule</a></div><div class="pick" id="pick">${S.map((x,i)=>`<button data-i="${i}" aria-label="${sn(x)}">${E[x.n]}</button>`).join('')}</div><div class="pinfo" id="pinfo"></div></div>
<a class="board" href="#match-1"><div style="display:flex;justify-content:space-between;align-items:center">${pill('live')}<span class="sub" style="color:inherit;opacity:.8">${sn(s)} · ${m.r}</span></div>
<div class="score"><div><b data-live="a">${m.sa}</b><span>${m.a}</span></div><div><b data-live="b">${m.sb}</b><span>${m.b}</span></div></div>
<div class="sub" style="color:inherit;opacity:.8">Currently leading: ECE with 104 points</div></a></section>
<div class="mq"><div>${[...S,...S].map(s=>`<span>${E[s.n]} ${sn(s)}</span>`).join('')}</div></div><div class="count"><span>Next event starts in</span><b id="cd">–</b></div><section class="sec"><div class="sech"><h2 class="disp">The championship race</h2><button class="rp" id="replay">↻ Replay</button></div><div class="mine"><label for="my">Your department</label><select id="my"><option value="">Choose…</option>${D.map(d=>`<option>${d[0]}</option>`).join('')}</select><span class="sub" id="gap">Pick a department to see how far it is from the lead.</span></div><div class="track" id="track">${D.map((d,i)=>`<a class="lane ${i==0?'first':''}" href="#dept-${d[0].toLowerCase()}" data-c="${d[0]}" title="${d[1]}: ${d[2]} points"><span class="ln">${d[0]}</span><span class="lt"><span class="run" style="--p:${d[2]/104*100}">${d[0].slice(0,4)}</span></span></a>`).join('')}<span class="fin"></span></div></section><section class="sec">${head('Standings','Full table','#board')}${D.slice(0,5).map((d,i)=>brow(d,i,104)).join('')}</section>
<section class="sec">${head('Find your sport','All sports','#sports')}${S.slice(0,4).map(srow).join('')}</section>`},
sports(){return`<div class="pageh"><h1>Sports</h1><div class="sub">${S.length} competitions in this demo</div></div><div class="chips" id="chips"></div><div id="list"></div>`},
sport(id){const s=sp(id);if(!s)return nf();const ms=M.filter(m=>m.s===id),c=C[s.c];return`<a class="back" href="#sports">Back to sports</a><div class="pageh"><h1>${sn(s)}</h1>${pill(s.st)}</div>
<div class="info"><div><b>${fd(s.d)}</b><span>Date</span></div><div><b>${s.v}</b><span>Venue</span></div><div><b>${c[0]}</b><span>Coordinator, ${c[2]} · ${c[3]}</span></div></div>
${head('Matches')}${ms.length?ms.map(mrow).join(''):'<div class="empty">Fixtures for this sport will appear here once they are published.</div>'}`},
match(id){const m=M.find(x=>x.id==id);if(!m)return nf();const s=sp(m.s),u=m.st==='upcoming';return`<a class="back" href="#sport-${s.id}">Back to ${sn(s)}</a>
<div class="board" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center">${pill(m.st)}<span class="sub" style="color:inherit;opacity:.8">${m.r}</span></div>
<div class="score"><div><b ${m.st==='live'?'data-live="a"':''}>${u?'–':m.sa}</b><span>${dn(m.a)}</span></div><div><b ${m.st==='live'?'data-live="b"':''}>${u?'–':m.sb}</b><span>${dn(m.b)}</span></div></div></div>
<div class="info"><div><b>${sn(s)}</b><span>Sport</span></div><div><b>${fd(s.d)}, ${m.tm}</b><span>Date and time</span></div><div><b>${s.v}</b><span>Venue</span></div></div>
${head('Who will win?')}<div class="poll" id="poll">${[m.a,m.b].map((t,k)=>`<button data-t="${k}">${t}</button>`).join('')}<div class="pbar"><i id="pa"></i></div><div class="sub" id="pt">Tap a team to cast your prediction.</div></div>${m.p?`${head('Set by set')}<div class="sets">${m.p.map((x,i)=>`<div><span class="sub">Set ${i+1}</span><br><b>${x[0]} – ${x[1]}</b></div>`).join('')}${m.st==='live'?`<div><span class="sub">Set ${m.p.length+1}, live</span><br><b>${m.sa} – ${m.sb}</b></div>`:''}</div>`:`<div class="empty">${u?'Scores will appear here once the match starts.':'Detailed scoring was not recorded for this match.'}</div>`}`},
schedule(){const days=[...new Set(S.map(s=>s.d))].sort();return`<div class="pageh"><h1>Schedule</h1><div class="sub">Dates and venues for every sport</div></div>${days.map(d=>`<div class="day">${fd(d)}</div>${S.filter(s=>s.d===d).map(srow).join('')}`).join('')}`},
board(){return`<div class="pageh"><h1>Leaderboard</h1><div class="sub">Sports points · 16 departments</div></div><div style="margin-top:20px">${D.map((d,i)=>brow(d,i,104)).join('')}</div>`},
dept(c){const i=D.findIndex(x=>x[0].toLowerCase()===c);if(i<0)return nf();const d=D[i],ms=M.filter(m=>m.a===d[0]||m.b===d[0]);return`<a class="back" href="#board">Back to leaderboard</a><div class="pageh"><h1>${d[0]}</h1><div class="sub">${d[1]}</div></div>
<div class="info"><div><b>#${i+1}</b><span>Position</span></div><div><b>${d[2]}</b><span>Points</span></div></div>${head('Matches')}${ms.length?ms.map(mrow).join(''):'<div class="empty">No matches recorded for this department yet.</div>'}`},
contacts(){return`<div class="pageh"><h1>Coordinators</h1><div class="sub">Sample contacts. Replace with real data.</div></div><div style="margin-top:20px">${C.map(c=>`<div class="row"><div class="grow"><h3 class="disp">${c[0]}</h3><div class="sub">${c[1]} · ${c[2]}</div></div><a class="btn alt" href="tel:${c[3].replace(/\s/g,'')}">${c[3]}</a></div>`).join('')}</div>`}};
const nf=()=>`<div class="pageh"><h1>Not found</h1></div><p><a class="btn" href="#home">Back home</a></p>`;

let F={st:'all',g:'all'};
function list(){const r=S.filter(s=>(F.st==='all'||s.st===F.st)&&(F.g==='all'||s.g===F.g));$('#list').innerHTML=r.length?r.map(srow).join(''):'<div class="empty">No sports match these filters. Clear a filter to see more.</div>';
const o=[['st','all','All'],['st','live','Live'],['st','upcoming','Upcoming'],['st','completed','Completed'],['g','Male','Male'],['g','Female','Female']];
$('#chips').innerHTML=o.map(x=>`<button class="chip ${F[x[0]]===x[1]?'on':''}" data-k="${x[0]}" data-v="${x[1]}">${x[2]}</button>`).join('');}
function route(){const h=location.hash.slice(1)||'home',i=h.indexOf('-'),t=i<0?h:h.slice(0,i),a=i<0?'':h.slice(i+1);
const f=V[t]||nf;app.innerHTML=f(a);app.style.animation='none';app.offsetWidth;app.style.animation='';
document.querySelectorAll('nav a').forEach(l=>l.classList.toggle('on',l.dataset.r===({sport:'sports',match:'sports',dept:'board'}[t]||t)));
if(t==='sports')list();grow();document.querySelectorAll('.row').forEach((r,i)=>r.style.animationDelay=Math.min(i,14)*40+'ms');scrollTo(0,0);document.title=(t==='home'?'':t[0].toUpperCase()+t.slice(1)+' | ')+'MVJCE Championship';}
document.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){const was=b.classList.contains('on');F[b.dataset.k]=b.dataset.v;if(b.dataset.v==='all')F.g='all';else if(b.dataset.k==='g'&&was)F.g='all';list();}});
addEventListener('hashchange',route);route();
// demo only: simulate points on the live match
setInterval(()=>{const m=M[0];if(Math.random()<.6)m.sa++;else m.sb++;document.querySelectorAll('[data-live]').forEach(e=>{e.textContent=m[e.dataset.live==='a'?'sa':'sb'];e.classList.remove('bump');e.offsetWidth;e.classList.add('bump')})},7000);

function pick(i){const s=S[i],m=M.find(x=>x.s===s.id);$('#pinfo').innerHTML=`<b>${sn(s)}</b> · ${fd(s.d)} · ${s.v}<br><a href="#sport-${s.id}">${m?m.a+' vs '+m.b+', view fixtures':'View fixtures'}</a>`;document.querySelectorAll('#pick button').forEach((b,k)=>b.classList.toggle('on',k==i))}
document.addEventListener('click',e=>{const b=e.target.closest('#pick button');if(b)pick(+b.dataset.i);
const p=e.target.closest('#poll button');if(p){const w=$('#poll');w.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===p));burst(p);const a=+p.dataset.t?42:58;$('#pa').style.width=a+'%';$('#pt').textContent=`Your pick: ${p.textContent}. ${a}% of fans back ${w.children[0].textContent} (demo).`}});
document.addEventListener('mousemove',e=>{const b=e.target.closest&&e.target.closest('.board');document.querySelectorAll('.board').forEach(x=>{if(x===b){const r=x.getBoundingClientRect();x.style.transform=`perspective(700px) rotateY(${((e.clientX-r.left)/r.width-.5)*8}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*8}deg)`}else x.style.transform=''})});
function tick(){const c=$('#cd');if(!c)return;const n=S.filter(s=>s.st==='upcoming').sort((a,b)=>a.d<b.d?-1:1)[0],d=Math.max(0,new Date(n.d+'T10:00')-new Date()),f=x=>String(x).padStart(2,'0');c.textContent=`${sn(n)}: ${Math.floor(d/864e5)}d ${f(Math.floor(d/36e5)%24)}h ${f(Math.floor(d/6e4)%60)}m ${f(Math.floor(d/1e3)%60)}s`}
setInterval(tick,1000);
function race(){const t=$('#track');if(!t)return;t.querySelectorAll('.run').forEach((r,i)=>r.style.transitionDelay=i*70+'ms');const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){t.classList.add('go');io.disconnect()}},{threshold:.35});io.observe(t)}
new MutationObserver(race).observe(app,{childList:true});
document.addEventListener('click',e=>{if(e.target.id==='replay'){const t=$('#track');t.classList.remove('go');t.offsetWidth;setTimeout(()=>t.classList.add('go'),60)}});
document.addEventListener('change',e=>{if(e.target.id!=='my')return;const c=e.target.value;document.querySelectorAll('.lane').forEach(l=>l.classList.toggle('me',l.dataset.c===c));const i=D.findIndex(x=>x[0]===c);$('#gap').textContent=i<0?'Pick a department to see how far it is from the lead.':i===0?`${c} leads by ${D[0][2]-D[1][2]} points over ${D[1][0]}.`:`${c} is ${D[0][2]-D[i][2]} points behind ${D[0][0]} and ${D[i-1][2]-D[i][2]} behind ${D[i-1][0]}.`});
function burst(el){const r=el.getBoundingClientRect(),c=['#B8322A','#F5921E','#FFC21A','#fff'];for(let i=0;i<28;i++){const s=document.createElement('i'),a=Math.random()*6.28,d=60+Math.random()*90;s.className='cf';s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${c[i%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-40}px;--r:${Math.random()*540}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
new MutationObserver(()=>{if($('#pick')&&!$('#pinfo').innerHTML){pick(0);tick()}}).observe(app,{childList:true});
</script>
</body>
</html>
